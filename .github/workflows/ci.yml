name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora_ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck API
        run: pnpm --filter @nexora/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @nexora/web typecheck

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Apply database migrations
        run: pnpm --filter @nexora/api migrate

      - name: Verify migrations are idempotent
        run: pnpm --filter @nexora/api migrate

      - name: Build Web
        run: pnpm --filter @nexora/web build
