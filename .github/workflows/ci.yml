name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Validate migration files
        shell: bash
        run: |
          test -f apps/api/migrations/001_initial_schema.sql
          test -f apps/api/migrations/002_saas_billing_access.sql
          test -f apps/api/migrations/003_billing_payment_safety.sql
          grep -q "CREATE TABLE IF NOT EXISTS organization_subscriptions" apps/api/migrations/002_saas_billing_access.sql
          grep -q "CREATE TABLE IF NOT EXISTS access_grants" apps/api/migrations/002_saas_billing_access.sql
          grep -q "UNIQUE (tenant_id, idempotency_key)" apps/api/migrations/001_initial_schema.sql
          grep -q "payments_one_pending_per_purchase_uq" apps/api/migrations/003_billing_payment_safety.sql

      - name: Typecheck API
        run: pnpm --filter @nexora/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @nexora/web typecheck

      - name: Test API
        run: pnpm --filter @nexora/api test

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Build Web
        run: pnpm --filter @nexora/web build
